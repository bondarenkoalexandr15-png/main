[project]
name = "invest-advisor"
version = "0.1.0"
description = "Инвестиционный советник (read-only) для T-Invest API: анализ портфеля и рекомендации"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# webapp.py содержит встроенный HTML/JS одной строкой — длина строк не критична.
"advisor/webapp.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
