<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Персональный сайт Александра Бондаренко"
    />
    <title>Александр Бондаренко</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07111f;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 20%, #1d4ed880, transparent 32rem),
          radial-gradient(circle at 82% 80%, #0f766e70, transparent 28rem),
          #07111f;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: clamp(36px, 8vw, 72px);
        border: 1px solid #ffffff24;
        border-radius: 28px;
        background: #0f172acc;
        box-shadow: 0 24px 80px #00000060;
        backdrop-filter: blur(18px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 28px;
        color: #99f6e4;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status::before {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2dd4bf;
        box-shadow: 0 0 18px #2dd4bf;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 9vw, 5.4rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 520px;
        margin: 28px 0 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 32px;
        padding: 13px 20px;
        border-radius: 12px;
        background: #f8fafc;
        color: #0f172a;
        font-weight: 750;
        text-decoration: none;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px #00000050;
      }

      a:focus-visible {
        outline: 3px solid #5eead4;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Сайт работает</div>
      <h1>Александр<br />Бондаренко</h1>
      <p>
        Это первая версия моего сайта. Скоро здесь появится больше информации.
      </p>
      <a href="https://github.com/bondarenkoalexandr15-png">Мой GitHub</a>
    </main>
  </body>
</html>
