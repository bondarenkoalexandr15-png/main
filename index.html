<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Персональный сайт Александра Бондаренко"
    />
    <title>Александр Бондаренко</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #050816;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 14% 18%, #2563eb55, transparent 32rem),
          radial-gradient(circle at 84% 78%, #14b8a644, transparent 30rem),
          linear-gradient(145deg, #050816, #0a1226 52%, #050816);
        background-size: 120% 120%;
        animation: background-shift 14s ease-in-out infinite alternate;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px);
        background-size: 54px 54px;
        -webkit-mask-image: linear-gradient(to bottom, #000, transparent 82%);
        mask-image: linear-gradient(to bottom, #000, transparent 82%);
        content: "";
      }

      .ambient {
        position: fixed;
        z-index: -1;
        width: clamp(220px, 30vw, 460px);
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(12px);
        opacity: 0.42;
        pointer-events: none;
        animation: drift 11s ease-in-out infinite alternate;
      }

      .ambient--blue {
        top: -14%;
        left: -8%;
        background: radial-gradient(circle, #3b82f6, transparent 68%);
      }

      .ambient--teal {
        right: -10%;
        bottom: -18%;
        background: radial-gradient(circle, #2dd4bf, transparent 68%);
        animation-delay: -5s;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 4vw, 48px);
      }

      .hero {
        position: relative;
        width: min(1040px, 100%);
        overflow: hidden;
        border: 1px solid #ffffff24;
        border-radius: clamp(24px, 4vw, 40px);
        background:
          linear-gradient(145deg, #ffffff10, transparent 38%),
          #0b1225c7;
        box-shadow:
          0 32px 100px #00000070,
          inset 0 1px #ffffff17;
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        animation: hero-enter 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .hero::after {
        position: absolute;
        top: -150px;
        right: -90px;
        width: 360px;
        height: 360px;
        border: 1px solid #5eead433;
        border-radius: 50%;
        box-shadow:
          0 0 0 48px #5eead40a,
          0 0 0 96px #5eead407;
        content: "";
        animation: orbit 18s linear infinite;
      }

      .navigation {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: clamp(22px, 4vw, 34px) clamp(24px, 5vw, 56px);
        border-bottom: 1px solid #ffffff14;
      }

      .logo {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid #ffffff25;
        border-radius: 14px;
        background: #ffffff0d;
        color: #ffffff;
        font-weight: 800;
        letter-spacing: -0.08em;
        text-decoration: none;
      }

      .availability {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: #ccfbf1;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .availability::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2dd4bf;
        box-shadow: 0 0 16px #2dd4bf;
        content: "";
        animation: pulse 2s ease-in-out infinite;
      }

      .hero__content {
        position: relative;
        z-index: 1;
        max-width: 850px;
        padding: clamp(54px, 9vw, 104px) clamp(24px, 8vw, 82px)
          clamp(48px, 8vw, 82px);
      }

      .eyebrow {
        margin: 0 0 24px;
        color: #93c5fd;
        font-size: clamp(0.76rem, 2vw, 0.9rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        animation: rise 700ms 250ms both;
      }

      h1 {
        margin: 0;
        max-width: 820px;
        font-size: clamp(3.2rem, 10vw, 7.6rem);
        line-height: 0.88;
        letter-spacing: -0.075em;
        animation: rise 750ms 360ms both;
      }

      .title-accent {
        display: inline-block;
        background: linear-gradient(90deg, #f8fafc, #93c5fd, #5eead4, #f8fafc);
        background-size: 240% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation:
          rise 750ms 360ms both,
          title-shine 7s linear 1.2s infinite;
      }

      .lead {
        max-width: 610px;
        margin: 34px 0 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2.4vw, 1.22rem);
        line-height: 1.7;
        animation: rise 750ms 470ms both;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 38px;
        animation: rise 750ms 580ms both;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
        border: 1px solid transparent;
        border-radius: 15px;
        font-weight: 800;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .button--primary {
        background: #f8fafc;
        box-shadow: 0 14px 36px #02061766;
        color: #0f172a;
      }

      .button--secondary {
        border-color: #ffffff24;
        background: #ffffff0a;
        color: #f8fafc;
      }

      .button span {
        transition: transform 180ms ease;
      }

      .button:hover {
        transform: translateY(-3px);
      }

      .button--primary:hover {
        box-shadow: 0 18px 44px #0206178c;
      }

      .button--secondary:hover {
        border-color: #5eead466;
        background: #5eead414;
      }

      .button:hover span {
        transform: translateX(3px);
      }

      .button:focus-visible,
      .logo:focus-visible {
        outline: 3px solid #5eead4;
        outline-offset: 4px;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 26px;
        margin: 48px 0 0;
        padding: 26px 0 0;
        border-top: 1px solid #ffffff17;
        animation: rise 750ms 690ms both;
      }

      .details__item {
        display: grid;
        gap: 6px;
      }

      .details__label {
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .details__value {
        color: #e2e8f0;
        font-size: 0.96rem;
        font-weight: 650;
      }

      @keyframes hero-enter {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.985);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
      }

      @keyframes background-shift {
        to {
          background-position: 30% 60%;
        }
      }

      @keyframes drift {
        to {
          transform: translate3d(6vw, 4vh, 0) scale(1.08);
        }
      }

      @keyframes title-shine {
        to {
          background-position: 240% center;
        }
      }

      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.75);
        }
      }

      @media (max-width: 560px) {
        .page {
          align-items: start;
          padding: 12px;
        }

        .hero {
          min-height: calc(100vh - 24px);
          border-radius: 24px;
        }

        .navigation {
          padding: 20px;
        }

        .availability {
          font-size: 0.68rem;
          letter-spacing: 0.06em;
        }

        .hero__content {
          padding: 58px 20px 34px;
        }

        h1 {
          font-size: clamp(3.25rem, 18vw, 5rem);
        }

        .lead {
          margin-top: 26px;
        }

        .actions {
          display: grid;
        }

        .button {
          width: 100%;
        }

        .details {
          gap: 20px;
          margin-top: 38px;
        }

        .details__item {
          width: calc(50% - 10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient--blue"></div>
    <div class="ambient ambient--teal"></div>
    <div class="page">
      <main class="hero">
        <nav class="navigation" aria-label="Основная навигация">
          <a class="logo" href="/" aria-label="На главную">АБ</a>
          <p class="availability">Сайт работает</p>
        </nav>

        <section class="hero__content">
          <p class="eyebrow">Персональное пространство · 2026</p>
          <h1>
            Александр<br />
            <span class="title-accent">Бондаренко</span>
          </h1>
          <p class="lead">
            Здесь идеи превращаются в цифровые проекты. Я создаю своё
            пространство, изучаю новые технологии и двигаюсь от первой версии к
            сильному результату.
          </p>

          <div class="actions">
            <a
              class="button button--primary"
              href="https://github.com/bondarenkoalexandr15-png?tab=repositories"
              target="_blank"
              rel="noreferrer"
            >
              Мои проекты <span aria-hidden="true">↗</span>
            </a>
            <a
              class="button button--secondary"
              href="https://github.com/bondarenkoalexandr15-png"
              target="_blank"
              rel="noreferrer"
            >
              Мой GitHub <span aria-hidden="true">→</span>
            </a>
          </div>

          <div class="details" aria-label="Информация">
            <div class="details__item">
              <span class="details__label">Фокус</span>
              <span class="details__value">Развитие проектов</span>
            </div>
            <div class="details__item">
              <span class="details__label">Подход</span>
              <span class="details__value">Идея → результат</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
